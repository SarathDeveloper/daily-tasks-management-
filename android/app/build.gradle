apply plugin: 'com.android.application'

// Release signing material comes from android/keystore.properties (git-ignored)
// or, for CI, from the DAYFLOW_KEYSTORE_FILE / DAYFLOW_KEYSTORE_PASSWORD /
// DAYFLOW_KEY_ALIAS / DAYFLOW_KEY_PASSWORD environment variables. Release builds
// (APK or Play bundle) fail if neither is set, rather than producing an
// unsigned artifact. Debug builds never need it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingValue = { String prop, String env -> keystoreProperties[prop] ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'DAYFLOW_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'DAYFLOW_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'DAYFLOW_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'DAYFLOW_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace = "com.dayflow.dailytasks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dayflow.dailytasks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump versionCode on every Play upload; keep versionName in step with package.json.
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package|sign)Release.*/ }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Create android/keystore.properties " +
            "(storeFile, storePassword, keyAlias, keyPassword) or set DAYFLOW_KEYSTORE_FILE, " +
            "DAYFLOW_KEYSTORE_PASSWORD, DAYFLOW_KEY_ALIAS and DAYFLOW_KEY_PASSWORD.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
